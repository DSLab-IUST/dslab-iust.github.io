name: Build DSLab IUST stats and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_linkedin_photos:
        description: Refresh alumni LinkedIn profile photos before building
        type: boolean
        default: false
  schedule:
    # GitHub stats + deploy, every 6 hours, away from the top of the hour.
    - cron: "17 */6 * * *"
    # LinkedIn photo cache, once nightly in off-peak hours (02:23 UTC / ~05:53 Iran).
    - cron: "23 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dslab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-linkedin-photos:
    if: "${{ github.event_name == 'schedule' && github.event.schedule == '23 2 * * *' || github.event_name == 'workflow_dispatch' && (inputs.refresh_linkedin_photos == true || inputs.refresh_linkedin_photos == 'true') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache alumni LinkedIn profile photos
        continue-on-error: true
        run: node scripts/update-linkedin-photos.mjs

      - name: Upload LinkedIn photo cache
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-photos
          path: |
            data/linkedin-photos.json
            assets/images/linkedin/

  build-and-deploy:
    needs: [refresh-linkedin-photos]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so sitemap lastmod can use accurate per-file git dates.
          fetch-depth: 0

      - name: Apply refreshed LinkedIn photos
        if: ${{ needs.refresh-linkedin-photos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linkedin-photos
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate member placeholder avatars
        run: node scripts/generate-member-placeholders.mjs

      - name: Commit generated member images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/placeholders/ assets/images/linkedin/ data/linkedin-photos.json
          if git diff --staged --quiet; then
            echo "No generated member image changes to commit."
          else
            git commit -m "chore: update generated member images"
            git push
          fi

      - name: Refresh public organization stats
        env:
          GITHUB_ORG: ${{ vars.DSLAB_GITHUB_ORG }}
          ACTIVITY_WINDOW_DAYS: 90
          EXCLUDE_REPOS: ${{ vars.DSLAB_EXCLUDE_REPOS }}
        run: node scripts/update-github-stats.mjs

      - name: Commit generated GitHub stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-stats.json assets/images/avatars/
          if git diff --staged --quiet; then
            echo "No generated GitHub stats changes to commit."
          else
            avatars_changed=false
            stats_meaningful=true
            if ! git diff --staged --quiet -- assets/images/avatars/; then
              avatars_changed=true
            fi
            if git show HEAD:data/github-stats.json >/tmp/github-stats.prev.json 2>/dev/null \
              && diff -q \
                <(jq -S 'del(.generatedAt, .totalCommits)' /tmp/github-stats.prev.json) \
                <(jq -S 'del(.generatedAt, .totalCommits)' data/github-stats.json) >/dev/null; then
              stats_meaningful=false
            fi
            if [ "$avatars_changed" = false ] && [ "$stats_meaningful" = false ]; then
              echo "Only generatedAt and totalCommits changed; skipping commit."
              git restore --staged data/github-stats.json
            else
              git commit -m "chore: update generated GitHub stats [skip ci]"
              git push
            fi
          fi

      - name: Build site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
