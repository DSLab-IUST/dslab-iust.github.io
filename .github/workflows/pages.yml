name: Build DSLab IUST stats and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 6 hours, away from the top of the hour.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh public organization stats
        env:
          GITHUB_ORG: ${{ vars.DSLAB_GITHUB_ORG }}
          ACTIVITY_WINDOW_DAYS: 90
          EXCLUDE_REPOS: ${{ vars.DSLAB_EXCLUDE_REPOS }}
        run: node scripts/update-github-stats.mjs

      - name: Build site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
