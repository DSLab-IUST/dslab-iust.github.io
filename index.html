<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>آزمایشگاه سیستم‌های توزیع‌شده — دانشگاه علم و صنعت ایران</title>
    <meta
      name="description"
      content="آزمایشگاه سیستم‌های توزیع‌شده دانشگاه علم و صنعت ایران — پژوهش، پروژه‌ها، اعضا و رویدادها."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080c12" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve theme and locale before first paint so nothing flashes. -->
    <script>
      (() => {
        const root = document.documentElement;
        const read = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };

        const storedTheme = read('dslab:theme');
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.dataset.theme =
          storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : systemTheme;

        const storedLocale = read('dslab:locale');
        const locale = storedLocale === 'en' || storedLocale === 'fa' ? storedLocale : 'fa';
        root.lang = locale;
        root.dir = locale === 'fa' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
