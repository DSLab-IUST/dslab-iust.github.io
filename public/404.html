<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>DS Lab</title>
    <!--
      GitHub Pages has no rewrite rules, so a deep link such as /admin is served
      by this file. Stash the requested path and hand control back to the SPA,
      which restores it before the router mounts.
    -->
    <script>
      sessionStorage.setItem('dslab:redirect', location.pathname + location.search + location.hash);
      location.replace(location.origin);
    </script>
  </head>
  <body></body>
</html>
