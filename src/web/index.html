<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10141F" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("dslab:theme");
          const theme = savedTheme === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          themeMeta?.setAttribute("content", theme === "dark" ? "#10141F" : "#F5F6F8");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="description" content="DSLab CE-IUST — Distributed Systems Research Lab at Iran University of Science and Technology. Research in distributed operating systems, high-performance computing, cloud environments, complex event processing, wireless sensor-actor networks, and computer security." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://dslab-iust.github.io/" />
    <meta property="og:title" content="DSLab CE-IUST — Distributed Systems Research Lab" />
    <meta property="og:description" content="Distributed Systems Research Lab at Iran University of Science and Technology, directed by Prof. Mohsen Sharifi." />

</html>
