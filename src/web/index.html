<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10141F" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("dslab:theme");
          document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="DSLab IUST — Distributed Systems Lab at Iran University of Science and Technology. Research in distributed operating systems, high-performance computing, cloud environments, complex event processing, wireless sensor-actor networks, and computer security." />
    <meta property="og:title" content="DSLab IUST — Distributed Systems Lab" />
    <meta property="og:description" content="Distributed Systems Lab at Iran University of Science and Technology, directed by Prof. Mohsen Sharifi." />
